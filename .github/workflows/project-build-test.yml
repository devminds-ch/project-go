name: Build and test the project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: 1.23

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [ 'linux', 'windows' ]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install dependencies
      run: go get .

    - name: Check code formatting
      run: test -z $(gofmt -l .)

    - name: Build
      run: |
        GOOS=${{ matrix.goos }}
        GOARCH=amd64
        go build -v -o go_training_project-${{ matrix.goos }}-amd64

    - name: Upload build artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: go_training_project-${{ matrix.goos }}-amd64
        path: go_training_project-${{ matrix.goos }}-amd64

    - name: Run Tests
      run: go test -v ./... -json > TestResults-${{ matrix.goos }}.json

    - name: Upload Go test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: TestResults-${{ matrix.goos }}
        path: TestResults-${{ matrix.goos }}.json
